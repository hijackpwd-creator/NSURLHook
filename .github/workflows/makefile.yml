name: Build NSURLHook

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Install Theos
      # =========================================================
      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/theos"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

          echo "========================================"
          echo "THEOS"
          echo "========================================"
          echo "$GITHUB_WORKSPACE/theos"


      # =========================================================
      # 3. Install iOS SDK
      # =========================================================
      - name: Install iOS SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          cd "$RUNNER_TEMP"

          rm -rf theos-sdks

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            theos-sdks

          echo "========================================"
          echo "Available SDKs"
          echo "========================================"

          find theos-sdks \
            -maxdepth 2 \
            -type d \
            -name "*.sdk" \
            -print

          echo "========================================"
          echo "Copy SDKs"
          echo "========================================"

          find theos-sdks \
            -maxdepth 2 \
            -type d \
            -name "*.sdk" \
            -exec cp -R {} "$THEOS/sdks/" \;

          echo "========================================"
          echo "Installed SDKs"
          echo "========================================"

          ls -lah "$THEOS/sdks"


      # =========================================================
      # 4. Install ldid
      # =========================================================
      - name: Install ldid
        shell: bash
        run: |
          set -e

          brew update

          brew install ldid

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

          export PATH="/opt/homebrew/bin:$PATH"

          echo "========================================"
          echo "ldid"
          echo "========================================"

          which ldid

          ldid -V || true

          echo "========================================"
          echo "ldid help"
          echo "========================================"

          ldid --help || true


      # =========================================================
      # 5. Install packaging dependencies
      # =========================================================
      - name: Install packaging dependencies
        shell: bash
        run: |
          set -e

          brew install dpkg fakeroot xz


      # =========================================================
      # 6. Verify build environment
      # =========================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:$THEOS/bin:$PATH"

          echo "========================================"
          echo "Environment"
          echo "========================================"

          echo "THEOS=$THEOS"
          echo "PATH=$PATH"

          echo "========================================"
          echo "Tools"
          echo "========================================"

          which make
          which clang
          which ldid
          which dpkg
          which fakeroot

          echo "========================================"
          echo "SDKs"
          echo "========================================"

          ls -lah "$THEOS/sdks"

          echo "========================================"
          echo "Theos"
          echo "========================================"

          test -d "$THEOS"
          test -d "$THEOS/sdks"


      # =========================================================
      # 7. Build
      # =========================================================
      - name: Build
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:$THEOS/bin:$PATH"

          echo "========================================"
          echo "Cleaning"
          echo "========================================"

          make clean

          echo "========================================"
          echo "Building"
          echo "========================================"

          make package FINALPACKAGE=1


      # =========================================================
      # 8. Verify generated dylib
      # =========================================================
      - name: Verify dylib
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find .theos -type f \
            \( -name "*.dylib" -o -name "*.deb" \) \
            -print || true

          echo "========================================"
          echo "Packages"
          echo "========================================"

          find packages \
            -maxdepth 1 \
            -type f \
            -print


      # =========================================================
      # 9. Upload Debian package
      # =========================================================
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NSURLHook-deb
          path: packages/*.deb
          if-no-files-found: error


      # =========================================================
      # 10. Upload dylib separately
      # =========================================================
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NSURLHook-dylib
          path: |
            .theos/obj/NSURLHook.dylib
          if-no-files-found: error
