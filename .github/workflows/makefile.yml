name: Build NSURLHook

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Install Theos
      # =========================================================
      - name: Install Theos
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/theos"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"


      # =========================================================
      # 3. Install iOS SDK
      # =========================================================
      - name: Install iOS SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          cd "$RUNNER_TEMP"

          rm -rf theos-sdks

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            theos-sdks

          echo "=== Available SDKs ==="

          find theos-sdks \
            -maxdepth 2 \
            -type d \
            -name "*.sdk" \
            -print

          echo "=== Copy SDKs ==="

          find theos-sdks \
            -maxdepth 2 \
            -type d \
            -name "*.sdk" \
            -exec cp -R {} "$THEOS/sdks/" \;

          echo "=== Installed SDKs ==="

          ls -lah "$THEOS/sdks"


      # =========================================================
      # 4. Install ldid
      # =========================================================
      - name: Install ldid
        shell: bash
        run: |
          set -e

          brew install ldid

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

          export PATH="/opt/homebrew/bin:$PATH"

          echo "=== ldid ==="

          which ldid

          ldid -V || true


      # =========================================================
      # 5. Install packaging tools
      #
      # IMPORTANT:
      # Do NOT install fakeroot on this arm64e build environment.
      # =========================================================
      - name: Install packaging tools
        shell: bash
        run: |
          set -e

          brew install dpkg xz

          echo "=== packaging tools ==="

          which dpkg
          which xz


      # =========================================================
      # 6. Verify environment
      # =========================================================
      - name: Verify environment
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:$THEOS/bin:$PATH"

          echo "========================================"
          echo "Environment"
          echo "========================================"

          echo "THEOS=$THEOS"
          echo "PATH=$PATH"

          echo "========================================"
          echo "Tools"
          echo "========================================"

          which make
          which clang
          which ldid
          which dpkg

          echo "========================================"
          echo "SDKs"
          echo "========================================"

          ls -lah "$THEOS/sdks"

          echo "========================================"
          echo "Project files"
          echo "========================================"

          test -f ./Makefile
          test -f ./Tweak.xm
          test -f ./NSURLHook.plist
          test -f ./control

          find . -maxdepth 2 -type f -print


      # =========================================================
      # 7. Build
      # =========================================================
      - name: Build
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:$THEOS/bin:$PATH"

          echo "========================================"
          echo "Cleaning"
          echo "========================================"

          make clean

          echo "========================================"
          echo "Building"
          echo "========================================"

          make package FINALPACKAGE=1


      # =========================================================
      # 8. Verify package
      # =========================================================
      - name: Verify package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Packages"
          echo "========================================"

          find packages \
            -maxdepth 1 \
            -type f \
            -print

          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"


      # =========================================================
      # 9. Upload DEB
      # =========================================================
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NSURLHook-deb
          path: packages/*.deb
          if-no-files-found: error


      # =========================================================
      # 10. Upload dylib
      # =========================================================
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NSURLHook-dylib
          path: .theos/obj/NSURLHook.dylib
          if-no-files-found: error
