name: Build NSURLHook

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Install SDKs
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          cd "$RUNNER_TEMP"

          git clone --depth 1 https://github.com/theos/sdks.git theos-sdks

          find theos-sdks -maxdepth 2 -type d -name "*.sdk" -print

          find theos-sdks -maxdepth 2 -type d -name "*.sdk" \
            -exec cp -R {} "$THEOS/sdks/" \;

          echo "=== Installed SDKs ==="
          ls -la "$THEOS/sdks"

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"

          test -d "$THEOS"
          test -d "$THEOS/sdks"

          echo "=== SDKs ==="
          ls -la "$THEOS/sdks"

          echo "=== Theos ==="
          "$THEOS/bin/nic.pl" --version || true
      - name: Install ldid
        run: |
          brew update
          brew install ldid
          ldid -V
      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show package
        run: |
          echo "=== packages ==="
          find packages -maxdepth 1 -type f -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NSURLHook-deb
          path: packages/*.deb
          if-no-files-found: error
